syntax = "proto3";

package muxcore.metadata.v1;

option go_package = "github.com/Muxcore-Media/contracts-metadata/muxcore/metadata/v1;metadatav1";

// MetadataService is the gRPC surface for MetadataProvider implementers.
service MetadataService {
  rpc Search(SearchRequest) returns (SearchResponse);
  rpc GetMovieDetails(GetMovieDetailsRequest) returns (GetMovieDetailsResponse);
  rpc GetTVDetails(GetTVDetailsRequest) returns (GetTVDetailsResponse);
  rpc GetSeasonDetails(GetSeasonDetailsRequest) returns (GetSeasonDetailsResponse);
  rpc GetEpisodeDetails(GetEpisodeDetailsRequest) returns (GetEpisodeDetailsResponse);
  rpc GetCollection(GetCollectionRequest) returns (GetCollectionResponse);
  rpc GetConfiguration(GetConfigurationRequest) returns (GetConfigurationResponse);
  rpc ListTrending(ListTrendingRequest) returns (ListTrendingResponse);
  rpc ListPopular(ListPopularRequest) returns (ListPopularResponse);
  rpc ListSimilar(ListSimilarRequest) returns (ListSimilarResponse);
  rpc ListRecommendations(ListRecommendationsRequest) returns (ListRecommendationsResponse);
  rpc FindByExternalID(FindByExternalIDRequest) returns (FindByExternalIDResponse);
  rpc GetAlternativeTitles(GetAlternativeTitlesRequest) returns (GetAlternativeTitlesResponse);
}

// ExternalIds carries provider-specific identifiers for lookup and cross-provider matching.
message ExternalIds {
  int32 tmdb_id = 1;
  int32 tvdb_id = 2;
  string imdb_id = 3;
}

message SearchRequest {
  string query = 1;
  MediaType type = 2;
  int32 page = 3;
  string language = 4;
  int32 year = 5;
  // When unset or false, implementers should omit adult titles from results.
  bool include_adult = 6;
  // ISO 3166-1 region code for localized discover/search (e.g. "US").
  string region = 7;
}

enum MediaType {
  MEDIA_TYPE_UNSPECIFIED = 0;
  MEDIA_TYPE_MOVIE = 1;
  MEDIA_TYPE_TV = 2;
}

message SearchResponse {
  repeated SearchResult results = 1;
  int32 total_results = 2;
  int32 total_pages = 3;
  int32 page = 4;
}

message SearchResult {
  int32 id = 1;
  string title = 2;
  string original_title = 3;
  string overview = 4;
  string poster_path = 5;
  string backdrop_path = 6;
  double vote_average = 7;
  int32 vote_count = 8;
  string release_date = 9;
  MediaType media_type = 10;
  repeated int32 genre_ids = 11;
  string original_language = 12;
  double popularity = 13;
  string name = 14;
  string first_air_date = 15;
  string imdb_id = 16;
  int32 tvdb_id = 17;
}

message GetMovieDetailsRequest {
  // Provider-native item id (TMDB id when using metadata-tmdb).
  int32 id = 1;
  string language = 2;
  repeated string append_to_response = 3;
  ExternalIds external_ids = 4;
}

message GetMovieDetailsResponse {
  int32 id = 1;
  string title = 2;
  string original_title = 3;
  string overview = 4;
  string tagline = 5;
  string poster_path = 6;
  string backdrop_path = 7;
  string release_date = 8;
  int32 runtime = 9;
  double vote_average = 10;
  int32 vote_count = 11;
  double popularity = 12;
  string status = 13;
  string original_language = 14;
  bool adult = 15;
  int64 budget = 16;
  int64 revenue = 17;
  string homepage = 18;
  string imdb_id = 19;
  repeated Genre genres = 20;
  repeated ProductionCompany production_companies = 21;
  repeated SpokenLanguage spoken_languages = 22;
  string backdrop_url = 23;
  string poster_url = 24;
  repeated Video videos = 25;
  repeated Credits credits = 26;
  Collection belongs_to_collection = 27;
  // Raw provider certification for certification_country (TMDB: release_dates),
  // e.g. "PG-13" or "NR"; trimmed, control characters removed, at most 16 bytes.
  // Empty when the provider has none. Not validated against a rating ladder:
  // the owning media module maps it (ADR-0031 §2) and treats unknown or empty
  // values as unavailable, never unrestricted. An operator rating always wins.
  string certification = 28;
  // ISO 3166-1 alpha-2 country the certification applies to (e.g. "US");
  // empty when certification is empty.
  string certification_country = 29;
}

message Collection {
  int32 id = 1;
  string name = 2;
  string poster_path = 3;
  string backdrop_path = 4;
}

message GetCollectionRequest {
  int32 id = 1;
  string language = 2;
  ExternalIds external_ids = 3;
}

message GetCollectionResponse {
  int32 id = 1;
  string name = 2;
  string overview = 3;
  string poster_path = 4;
  string backdrop_path = 5;
  repeated CollectionPart parts = 6;
}

message CollectionPart {
  int32 id = 1;
  string title = 2;
  string original_title = 3;
  string overview = 4;
  string poster_path = 5;
  string backdrop_path = 6;
  string release_date = 7;
  double vote_average = 8;
  MediaType media_type = 9;
}

message Genre {
  int32 id = 1;
  string name = 2;
}

message ProductionCompany {
  int32 id = 1;
  string name = 2;
  string logo_path = 3;
  string origin_country = 4;
}

message SpokenLanguage {
  string iso_639_1 = 1;
  string name = 2;
}

message Video {
  string id = 1;
  string key = 2;
  string name = 3;
  string site = 4;
  string type = 5;
}

message Credits {
  repeated CastMember cast = 1;
  repeated CrewMember crew = 2;
}

message CastMember {
  int32 id = 1;
  string name = 2;
  string character = 3;
  string profile_path = 4;
  int32 order = 5;
}

message CrewMember {
  int32 id = 1;
  string name = 2;
  string job = 3;
  string department = 4;
  string profile_path = 5;
}

message GetTVDetailsRequest {
  int32 id = 1;
  string language = 2;
  repeated string append_to_response = 3;
  ExternalIds external_ids = 4;
}

message GetTVDetailsResponse {
  int32 id = 1;
  string name = 2;
  string original_name = 3;
  string overview = 4;
  string tagline = 5;
  string poster_path = 6;
  string backdrop_path = 7;
  string first_air_date = 8;
  string last_air_date = 9;
  int32 number_of_seasons = 10;
  int32 number_of_episodes = 11;
  double vote_average = 12;
  int32 vote_count = 13;
  double popularity = 14;
  string status = 15;
  string original_language = 16;
  string homepage = 17;
  reserved 18; // was string in_production; use bool in_production at tag 30
  repeated Genre genres = 19;
  repeated Season seasons = 20;
  repeated ProductionCompany production_companies = 21;
  repeated SpokenLanguage spoken_languages = 22;
  string backdrop_url = 23;
  string poster_url = 24;
  repeated Video videos = 25;
  repeated Credits credits = 26;
  repeated CreatedBy created_by = 27;
  repeated Network networks = 28;
  repeated string origin_country = 29;
  bool in_production = 30;
  string imdb_id = 31;
  int32 tvdb_id = 32;
  // Raw provider content rating for certification_country (TMDB: content_ratings),
  // e.g. "TV-MA"; same rules as GetMovieDetailsResponse.certification.
  string certification = 33;
  // ISO 3166-1 alpha-2 country the certification applies to (e.g. "US");
  // empty when certification is empty.
  string certification_country = 34;
}

message CreatedBy {
  int32 id = 1;
  string name = 2;
  string profile_path = 3;
}

message Network {
  int32 id = 1;
  string name = 2;
  string logo_path = 3;
  string origin_country = 4;
}

message Season {
  int32 id = 1;
  string name = 2;
  string overview = 3;
  string poster_path = 4;
  string air_date = 5;
  int32 season_number = 6;
  int32 episode_count = 7;
  double vote_average = 8;
}

message GetSeasonDetailsRequest {
  int32 id = 1;
  int32 season_number = 2;
  string language = 3;
  ExternalIds external_ids = 4;
}

message GetEpisodeDetailsRequest {
  int32 id = 1;
  int32 season_number = 2;
  int32 episode_number = 3;
  string language = 4;
  ExternalIds external_ids = 5;
}

message GetEpisodeDetailsResponse {
  Episode episode = 1;
}

message Episode {
  int32 id = 1;
  string name = 2;
  string overview = 3;
  string air_date = 4;
  int32 episode_number = 5;
  int32 season_number = 6;
  string still_path = 7;
  int32 runtime = 8;
  double vote_average = 9;
  int32 vote_count = 10;
  string production_code = 11;
  string still_url = 12;
}

message GetSeasonDetailsResponse {
  int32 id = 1;
  string name = 2;
  string overview = 3;
  string poster_path = 4;
  string air_date = 5;
  int32 season_number = 6;
  double vote_average = 7;
  repeated Episode episodes = 8;
}

message GetConfigurationRequest {}

message GetConfigurationResponse {
  string base_url = 1;
  repeated string poster_sizes = 2;
  repeated string backdrop_sizes = 3;
  repeated string logo_sizes = 4;
  repeated string profile_sizes = 5;
  repeated string still_sizes = 6;
  string secure_base_url = 7;
}

message ListTrendingRequest {
  TrendingMediaType media_type = 1;
  TrendingTimeWindow time_window = 2;
  int32 page = 3;
  string language = 4;
}

enum TrendingMediaType {
  TRENDING_MEDIA_TYPE_UNSPECIFIED = 0;
  TRENDING_MEDIA_TYPE_ALL = 1;
  TRENDING_MEDIA_TYPE_MOVIE = 2;
  TRENDING_MEDIA_TYPE_TV = 3;
}

enum TrendingTimeWindow {
  TRENDING_TIME_WINDOW_UNSPECIFIED = 0;
  TRENDING_TIME_WINDOW_DAY = 1;
  TRENDING_TIME_WINDOW_WEEK = 2;
}

message ListTrendingResponse {
  repeated SearchResult results = 1;
  int32 total_results = 2;
  int32 total_pages = 3;
  int32 page = 4;
}

message ListPopularRequest {
  MediaType type = 1;
  int32 page = 2;
  string language = 3;
}

message ListPopularResponse {
  repeated SearchResult results = 1;
  int32 total_results = 2;
  int32 total_pages = 3;
  int32 page = 4;
}

message ListSimilarRequest {
  MediaType type = 1;
  int32 id = 2;
  int32 page = 3;
  string language = 4;
  ExternalIds external_ids = 5;
}

message ListSimilarResponse {
  repeated SearchResult results = 1;
  int32 total_results = 2;
  int32 total_pages = 3;
  int32 page = 4;
}

message ListRecommendationsRequest {
  MediaType type = 1;
  int32 id = 2;
  int32 page = 3;
  string language = 4;
  ExternalIds external_ids = 5;
}

message ListRecommendationsResponse {
  repeated SearchResult results = 1;
  int32 total_results = 2;
  int32 total_pages = 3;
  int32 page = 4;
}

message FindByExternalIDRequest {
  string external_id = 1;
  string external_source = 2; // e.g. "imdb_id", "tvdb_id"
  string language = 3;
}

message FindByExternalIDResponse {
  repeated SearchResult results = 1;
}

message GetAlternativeTitlesRequest {
  int32 id = 1;
  MediaType type = 2;
  ExternalIds external_ids = 3;
}

message AlternativeTitle {
  string title = 1;
  string type = 2; // country / iso / title type from provider
}

message GetAlternativeTitlesResponse {
  int32 id = 1;
  repeated AlternativeTitle titles = 2;
}
